[pytest]
minversion = 7.0
testpaths = automation/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

markers =
    api: mark test as REST API automated test
    ui: mark test as Selenium Web UI automated test
    smoke: mark test as smoke test
    regression: mark test as regression test

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
