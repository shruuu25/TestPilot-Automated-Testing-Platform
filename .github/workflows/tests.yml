name: TestPilot Automated CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  testpilot-automation-suite:
    name: Build, Test & Report
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: testpilot
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -prootpassword" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: mysql+pymysql://root:rootpassword@127.0.0.1:3306/testpilot
      API_BASE_URL: http://127.0.0.1:8000
      FRONTEND_URL: http://127.0.0.1:5173
      HEADLESS: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Google Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r automation/requirements.txt

      - name: Install & Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Seed Database Schema
        run: |
          mysql -h 127.0.0.1 -u root -prootpassword testpilot < database/schema.sql
          mysql -h 127.0.0.1 -u root -prootpassword testpilot < database/seed.sql

      - name: Start FastAPI Backend Service
        run: |
          nohup uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 > logs/backend.log 2>&1 &
          echo "Waiting for FastAPI backend to become healthy..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q "healthy"; then
              echo "FastAPI backend is ready!"
              break
            fi
            sleep 1
          done

      - name: Start Frontend Preview Server
        run: |
          nohup npm --prefix frontend run preview -- --host 0.0.0.0 --port 5173 > logs/frontend.log 2>&1 &
          echo "Waiting for React frontend preview to become ready..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5173 > /dev/null; then
              echo "React frontend preview is ready!"
              break
            fi
            sleep 1
          done

      - name: Run REST API Automated Tests
        run: |
          pytest automation/tests/api -v -m api

      - name: Run Selenium Web UI Automated Tests
        run: |
          pytest automation/tests/ui -v -m ui

      - name: Generate Consolidated HTML Test Report
        if: always()
        run: |
          pytest automation/tests -v --html=reports/report.html --self-contained-html

      - name: Upload Test Reports, Screenshots & Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testpilot-execution-artifacts
          path: |
            reports/
            screenshots/
            logs/
          retention-days: 14
